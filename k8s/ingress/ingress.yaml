apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cairo-traffic-ingress
  namespace: cairo-traffic
  annotations:
    # Use the nginx ingress controller installed for kind
    kubernetes.io/ingress.class: "nginx"
    # Strip /api prefix is NOT needed — the backend already expects /api/... paths
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Route /api/* → backend:5000  (backend handles /api/traffic/...)
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend
                port:
                  number: 5000
          # Route /health → backend:5000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5000
          # Everything else → frontend:80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
