apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: cairo-traffic
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      # ─── Init container reads Discord URL from Secret env var and writes
      #     alertmanager.yml to emptyDir — no ConfigMap needed ───────────────
      initContainers:
        - name: alertmanager-config-init
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat > /etc/alertmanager/alertmanager.yml << AMEOF
              global:
                resolve_timeout: 5m

              route:
                group_by: ['alertname', 'severity']
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 1h
                receiver: discord-default

                routes:
                  # Critical alerts → immediate Discord message
                  - matchers:
                      - severity = critical
                    receiver: discord-critical
                    group_wait: 10s
                    repeat_interval: 30m

                  # Warning alerts → standard Discord message
                  - matchers:
                      - severity = warning
                    receiver: discord-warning
                    repeat_interval: 2h

              receivers:
                # ── Default (catch-all) ──────────────────────────────────────
                - name: discord-default
                  discord_configs:
                    - webhook_url: '${DISCORD_WEBHOOK_URL}'
                      title: '🚦 Cairo Traffic Alert'
                      message: |
                        **{{ .CommonAnnotations.summary }}**
                        {{ range .Alerts }}
                        • {{ .Annotations.description }}
                        {{ end }}

                # ── Critical (service down, high congestion) ─────────────────
                - name: discord-critical
                  discord_configs:
                    - webhook_url: '${DISCORD_WEBHOOK_URL}'
                      title: '🔴 CRITICAL — Cairo Traffic'
                      message: |
                        @here **{{ .CommonAnnotations.summary }}**
                        {{ range .Alerts }}
                        🚨 **Alert:** {{ .Labels.alertname }}
                        📍 **Instance:** {{ .Labels.instance }}
                        📝 {{ .Annotations.description }}
                        ⏰ **Started:** {{ .StartsAt.Format "2006-01-02 15:04:05 UTC" }}
                        {{ end }}

                # ── Warning (high CPU, high memory, error rates) ─────────────
                - name: discord-warning
                  discord_configs:
                    - webhook_url: '${DISCORD_WEBHOOK_URL}'
                      title: '⚠️ WARNING — Cairo Traffic'
                      message: |
                        **{{ .CommonAnnotations.summary }}**
                        {{ range .Alerts }}
                        ⚠️ **Alert:** {{ .Labels.alertname }}
                        📍 **Instance:** {{ .Labels.instance }}
                        📝 {{ .Annotations.description }}
                        {{ end }}

              inhibit_rules:
                - source_matchers:
                    - severity = critical
                  target_matchers:
                    - severity = warning
                  equal: ['alertname']
              AMEOF

              echo "Alertmanager config written successfully"
          env:
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: alertmanager-discord
                  key: DISCORD_WEBHOOK_URL
          volumeMounts:
            - name: alertmanager-config-vol
              mountPath: /etc/alertmanager

      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.listen-address=:9093
            - --cluster.listen-address=
          ports:
            - containerPort: 9093
              name: http
          volumeMounts:
            - name: alertmanager-config-vol
              mountPath: /etc/alertmanager
            - name: alertmanager-storage
              mountPath: /alertmanager
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 10
            periodSeconds: 10

      volumes:
        - name: alertmanager-config-vol
          emptyDir: {}
        - name: alertmanager-storage
          emptyDir: {}
