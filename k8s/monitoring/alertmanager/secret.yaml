apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-discord
  namespace: cairo-traffic
type: Opaque
stringData:
  # Replace the value below with your actual Discord webhook URL
  # Format: https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN
  DISCORD_WEBHOOK_URL: "https://discord.com/api/webhooks/REPLACE_ME/REPLACE_ME"
