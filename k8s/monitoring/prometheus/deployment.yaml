apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: cairo-traffic
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus

      # ─── Init container writes prometheus.yml to emptyDir (no ConfigMap) ───
      initContainers:
        - name: prometheus-config-init
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat > /etc/prometheus/prometheus.yml << 'PROMEOF'
              global:
                scrape_interval: 15s
                evaluation_interval: 15s

              alerting:
                alertmanagers:
                  - static_configs:
                      - targets:
                          - alertmanager:9093

              rule_files:
                - /etc/prometheus/rules.yml

              scrape_configs:

                # ── Cairo Backend (Node.js + prom-client) ──────────────────
                - job_name: cairo-backend
                  kubernetes_sd_configs:
                    - role: pod
                      namespaces:
                        names: [cairo-traffic]
                  relabel_configs:
                    - source_labels: [__meta_kubernetes_pod_label_app]
                      action: keep
                      regex: backend
                    - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                      action: keep
                      regex: "true"
                    - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                      action: replace
                      target_label: __metrics_path__
                      regex: (.+)
                    - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                      action: replace
                      regex: ([^:]+)(?::\d+)?;(\d+)
                      replacement: $1:$2
                      target_label: __address__
                    - action: labelmap
                      regex: __meta_kubernetes_pod_label_(.+)
                    - source_labels: [__meta_kubernetes_namespace]
                      target_label: namespace
                    - source_labels: [__meta_kubernetes_pod_name]
                      target_label: pod

                # ── All annotated pods in namespace ────────────────────────
                - job_name: kubernetes-pods
                  kubernetes_sd_configs:
                    - role: pod
                      namespaces:
                        names: [cairo-traffic]
                  relabel_configs:
                    - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                      action: keep
                      regex: "true"
                    - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                      action: replace
                      target_label: __metrics_path__
                      regex: (.+)
                    - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                      action: replace
                      regex: ([^:]+)(?::\d+)?;(\d+)
                      replacement: $1:$2
                      target_label: __address__
                    - action: labelmap
                      regex: __meta_kubernetes_pod_label_(.+)
                    - source_labels: [__meta_kubernetes_namespace]
                      target_label: namespace
                    - source_labels: [__meta_kubernetes_pod_name]
                      target_label: pod

                # ── Kubernetes Nodes (kubelet) ─────────────────────────────
                - job_name: kubernetes-nodes
                  scheme: https
                  tls_config:
                    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                    insecure_skip_verify: true
                  bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                  kubernetes_sd_configs:
                    - role: node
                  relabel_configs:
                    - action: labelmap
                      regex: __meta_kubernetes_node_label_(.+)
                    - target_label: __address__
                      replacement: kubernetes.default.svc:443
                    - source_labels: [__meta_kubernetes_node_name]
                      regex: (.+)
                      target_label: __metrics_path__
                      replacement: /api/v1/nodes/$1/proxy/metrics

                # ── Container metrics via cAdvisor ─────────────────────────
                - job_name: kubernetes-cadvisor
                  scheme: https
                  tls_config:
                    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                    insecure_skip_verify: true
                  bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                  kubernetes_sd_configs:
                    - role: node
                  relabel_configs:
                    - action: labelmap
                      regex: __meta_kubernetes_node_label_(.+)
                    - target_label: __address__
                      replacement: kubernetes.default.svc:443
                    - source_labels: [__meta_kubernetes_node_name]
                      regex: (.+)
                      target_label: __metrics_path__
                      replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

                # ── Prometheus self-monitoring ─────────────────────────────
                - job_name: prometheus
                  static_configs:
                    - targets: ['localhost:9090']
              PROMEOF

              cat > /etc/prometheus/rules.yml << 'RULESEOF'
              groups:
                - name: cairo-traffic-alerts
                  rules:

                    # High Traffic Congestion
                    - alert: HighCongestion
                      expr: cairo_congestion_level > 0.8
                      for: 3m
                      labels:
                        severity: critical
                      annotations:
                        summary: "🚦 High Congestion in {{ $labels.district }}"
                        description: "Congestion level {{ $value | humanize }} exceeds 80% in district {{ $labels.district }}"

                    # Any Cairo service is unreachable
                    - alert: ServiceDown
                      expr: up{job=~"cairo-.*|kubernetes-pods"} == 0
                      for: 1m
                      labels:
                        severity: critical
                      annotations:
                        summary: "🔴 Service Down: {{ $labels.job }}"
                        description: "{{ $labels.job }} on {{ $labels.instance }} has been unreachable for more than 1 minute"

                    # High CPU on any node
                    - alert: HighCPUUsage
                      expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
                      for: 5m
                      labels:
                        severity: warning
                      annotations:
                        summary: "⚠️ High CPU on {{ $labels.instance }}"
                        description: "CPU usage is {{ $value | humanize }}% (threshold 85%) on {{ $labels.instance }}"

                    # High API error rate
                    - alert: HighErrorRate
                      expr: rate(http_requests_total{job="cairo-backend", status=~"5.."}[5m]) > 0.05
                      for: 2m
                      labels:
                        severity: warning
                      annotations:
                        summary: "⚠️ High error rate on Cairo Backend"
                        description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes"

                    # High memory usage on nodes
                    - alert: HighMemoryUsage
                      expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
                      for: 5m
                      labels:
                        severity: warning
                      annotations:
                        summary: "⚠️ High Memory Usage on {{ $labels.instance }}"
                        description: "Memory usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}"
              RULESEOF

              echo "Prometheus config written successfully"
          volumeMounts:
            - name: prometheus-config-vol
              mountPath: /etc/prometheus

      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --web.enable-lifecycle
            - --web.enable-admin-api
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: prometheus-config-vol
              mountPath: /etc/prometheus
            - name: prometheus-storage
              mountPath: /prometheus
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10

      volumes:
        - name: prometheus-config-vol
          emptyDir: {}
        - name: prometheus-storage
          emptyDir: {}
