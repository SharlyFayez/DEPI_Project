apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
  namespace: cairo-traffic
  labels:
    app: simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simulator
  template:
    metadata:
      labels:
        app: simulator
    spec:
      containers:
        - name: simulator
          image: cairo-traffic-simulator:latest
          imagePullPolicy: Never
          env:
            - name: API_URL
              value: "http://backend:5000/api/traffic"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
