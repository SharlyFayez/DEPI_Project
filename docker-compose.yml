version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: cairo_traffic_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB:       traffic_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./back
    container_name: cairo_traffic_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/traffic_db
      PORT: 5000
    ports:
      - "5000:5000"
    command: >
      sh -c "npx prisma migrate deploy && node src/app.js"

  simulator:
    build: ./simulator
    container_name: cairo_traffic_simulator
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_URL: http://backend:5000/api/traffic

  frontend:
    build: ./front
    container_name: cairo_traffic_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
