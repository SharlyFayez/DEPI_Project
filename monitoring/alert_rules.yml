groups:
- name: cairo_traffic_alerts
  rules:

  # ─── Service Down ───────────────────────────────────
  - alert: ServiceDown
    expr: up == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Service {{ $labels.job }} is DOWN"
      description: "Service {{ $labels.job }} has been down for more than 1 minute."

  # ─── High CPU Usage ─────────────────────────────────
  - alert: HighCPUUsage
    expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "High CPU usage on {{ $labels.instance }}"
      description: "CPU usage is above 80% for more than 2 minutes."

  # ─── High Memory Usage ──────────────────────────────
  - alert: HighMemoryUsage
    expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "High memory usage on {{ $labels.instance }}"
      description: "Memory usage is above 85% for more than 2 minutes."

  # ─── Container Restart ──────────────────────────────
  - alert: ContainerRestarting
    expr: rate(container_last_seen[5m]) > 0 and delta(container_start_time_seconds[5m]) > 0
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "Container {{ $labels.name }} is restarting"
      description: "Container has restarted in the last 5 minutes."

  # ─── High HTTP Error Rate ────────────────────────────
  - alert: HighErrorRate
    expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "High HTTP error rate"
      description: "More than 10% of requests are returning 5xx errors."
