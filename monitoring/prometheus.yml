global:
  scrape_interval: 15s # كل 15 ثانية بيجمع metrics
  evaluation_interval: 15s # كل 15 ثانية بيقيّم الـ alerts

# ─── Alert Rules ───────────────────────────────────────────
rule_files:
- "alert_rules.yml"

# ─── Alertmanager ──────────────────────────────────────────
alerting:
  alertmanagers:
  - static_configs:
    - targets: [ 'alertmanager:9093' ]

# ─── Scrape Configs ────────────────────────────────────────
scrape_configs:

# Prometheus نفسه
- job_name: 'prometheus'
  static_configs:
  - targets: [ 'localhost:9090' ]

# Cairo Traffic Backend
- job_name: 'cairo-traffic-backend'
  static_configs:
  - targets: [ 'host.docker.internal:80' ]
  metrics_path: '/metrics'

# Node Exporter (CPU, Memory, Disk)
- job_name: 'node-exporter'
  static_configs:
  - targets: [ 'node-exporter:9100' ]

# cAdvisor (Docker containers metrics)
- job_name: 'cadvisor'
  static_configs:
  - targets: [ 'cadvisor:8080' ]
